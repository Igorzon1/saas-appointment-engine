{% extends "base.html" %}

{% block title %}Cadastro - DentistFlow{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 30px; border: 1px solid #e1e1e1; border-radius: 10px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    
    <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Crie sua Conta</h2>
    
    {% if error %}
        <div style="background: #fee2e2; color: #991b1b; padding: 10px; margin-bottom: 15px; border-radius: 6px; font-size: 0.9rem; text-align: center;">
            {{ error }}
        </div>
    {% endif %}

    <form action="{{ url_for('auth.register_view') }}" method="POST">
        
        <div class="form-group" style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Nome Completo</label>
            <input type="text" name="name" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Email</label>
            <input type="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Senha</label>
            <input type="password" name="password" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div class="form-group" style="margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 5px;">
            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Tipo de Conta</label>
            <select name="role" id="roleSelect" onchange="toggleCrmField()" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                <option value="patient">Paciente (Quero agendar consultas)</option>
                <option value="dentist">Dentista (Sou o profissional)</option>
            </select>
        </div>

        <div class="form-group" id="crmField" style="margin-bottom: 15px; display: none;">
            <label style="display: block; margin-bottom: 5px; font-weight: 500;">Número do Registro (CRM/CRO)</label>
            <input type="text" name="crm" placeholder="Ex: 12345-PB" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <button type="submit" style="width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; font-weight: 600;">
            Cadastrar
        </button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; color: #666;">
        Já tem conta? <a href="{{ url_for('auth.login_view') }}" style="color: #007bff; text-decoration: none;">Faça Login</a>
    </p>

</div>

<script>
    // Função para mostrar/esconder o campo CRM
    function toggleCrmField() {
        const role = document.getElementById('roleSelect').value;
        const crmDiv = document.getElementById('crmField');
        
        if (role === 'dentist') {
            crmDiv.style.display = 'block';
        } else {
            crmDiv.style.display = 'none';
        }
    }
</script>
{% endblock %}
