{% extends "base.html" %}

{% block title %}Cadastro - DentistFlow{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 30px; border: 1px solid #e1e1e1; border-radius: 10px; background: #fff;">
    
    <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Crie sua Conta</h2>
    
    {% if error %}
        <div style="background: #fee2e2; color: #991b1b; padding: 10px; margin-bottom: 15px; border-radius: 6px;">
            {{ error }}
        </div>
    {% endif %}

    <form action="{{ url_for('auth.register_view') }}" method="POST">
        
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Nome Completo (ou Razão Social)</label>
            <input type="text" name="name" required class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label>Email</label>
            <input type="email" name="email" required class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label>Senha</label>
            <input type="password" name="password" required class="form-control" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div class="form-group" style="margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 5px;">
            <label>Tipo de Conta</label>
            <select name="role" id="roleSelect" onchange="toggleFields()" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                <option value="patient">Paciente (Quero agendar)</option>
                <option value="dentist">Dentista (Pessoa Física)</option>
                <option value="clinic">Clínica (Pessoa Jurídica)</option>
            </select>
        </div>

        <div class="form-group" id="crmField" style="margin-bottom: 15px; display: none;">
            <label>CRM / CRO</label>
            <input type="text" name="crm" placeholder="Ex: 12345-PB" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <div class="form-group" id="cnpjField" style="margin-bottom: 15px; display: none;">
            <label>CNPJ</label>
            <input type="text" name="cnpj" placeholder="00.000.000/0000-00" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        </div>

        <button type="submit" style="width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: 600; cursor: pointer;">
            Cadastrar
        </button>
    </form>
    
    <p style="text-align: center; margin-top: 20px;">
        Já tem conta? <a href="{{ url_for('auth.login_view') }}">Faça Login</a>
    </p>

</div>

<script>
    function toggleFields() {
        const role = document.getElementById('roleSelect').value;
        const crmDiv = document.getElementById('crmField');
        const cnpjDiv = document.getElementById('cnpjField');
        
        // Reseta visibilidade
        crmDiv.style.display = 'none';
        cnpjDiv.style.display = 'none';

        if (role === 'dentist') {
            crmDiv.style.display = 'block';
        } else if (role === 'clinic') {
            cnpjDiv.style.display = 'block';
        }
    }
</script>
{% endblock %}
